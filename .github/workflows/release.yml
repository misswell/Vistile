name: Release

# 构建 arm64 .app → Developer ID 签名 → Apple 公证 → 装订 → 出镜像 → 复核 → GitHub Release。
# 需要仓库 secrets（缺哪项，verify 任务就点名报哪项）：缺凭据时构建仍跑一次未签名自检，
# 用来先证明 runner 的工具链编得过；发布任务只在凭据齐、真走过公证装订时才执行。
#   APPLE_DEVELOPER_ID_P12_BASE64 / APPLE_DEVELOPER_ID_P12_PASSWORD   签名证书
#   公证二选一：APPLE_API_KEY_BASE64(+APPLE_API_KEY_ID/APPLE_API_ISSUER)
#              或 APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD
# 只想知道凭据配没配对：手动触发并勾 probeCredentials，它只装证书、试签、问一次公证，
# 不做构建，也不发布任何东西。
# 手动自检请填测试标签（v9.9.9-dryrun）：产物名由标签决定，照抄真实版本号会产出一个
# 和线上 Release 资产同名、字节完全不同的包（verify 任务会为此打警告）。
# 只有 arm64：x86_64 从没在 Intel 真机上打开过，产一个没人验过的架构安装包，
# 和说明里写「Intel 未测」自相矛盾。要发 Intel 先补真机验证。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 产物命名用的版本；自检请填 v9.9.9-dryrun，不要填真实版本号
        required: true
        type: string
      publish:
        description: 校验通过后是否发布 GitHub Release
        required: true
        default: false
        type: boolean
      probeCredentials:
        description: 只验证签名与公证凭据能否在 Runner 上用通，不做构建
        required: false
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}

jobs:
  verify:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probeCredentials) }}
    runs-on: macos-14
    outputs:
      signing_ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: 选最新 Xcode 并打印工具链
        # Packages/VistileCore/Package.swift 要 swift-tools-version 6.0（Xcode 16+），
        # 镜像的默认版本不一定够新，直接取装得最高的那个。
        # 必须在本步就 export：只写 GITHUB_ENV 的话，下面这几行打印的还是镜像默认的 15.4，
        # 日志会声称自己是另一套工具链——它跟真正构建用的那个不是一回事。
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          export DEVELOPER_DIR="$newest/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >>"$GITHUB_ENV"
          sw_vers -productVersion
          xcodebuild -version
          # 记进日志：兼容矩阵要说清发出去的包是用哪个 SDK 编的，不能凭印象。
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: 纯逻辑测试
        working-directory: Packages/VistileCore
        run: swift test

      - name: 标签版本与 Info.plist 是否一致
        run: |
          set -euo pipefail
          conf="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "v${conf}" = "${RELEASE_TAG}" ] || {
              echo "标签 ${RELEASE_TAG} 对不上 Support/Info.plist 的 ${conf}：先改版本号再打标签" >&2
              exit 1
            }
            echo "==> ${RELEASE_TAG} 与 Info.plist 的 ${conf} 一致"
          elif [ "${RELEASE_TAG}" = "v${conf}" ]; then
            # 产物文件名只由 RELEASE_TAG 决定。手动自检如果照抄真实版本号，就会产出一个
            # 和线上 Release 资产同名、字节却完全不同的 dmg——v0.1.1 那次就是这么踩的，
            # 隔几天回头看极易误当「这个版本已经发过了」。不硬拦，因为「重发同一版」是合法的兜底路线。
            echo "::warning::手动触发却用了真实版本号 ${RELEASE_TAG}，自检产物会和线上同名资产混淆。自检请改用 v9.9.9-dryrun。"
            {
              echo "### 干跑用了真实版本号"
              echo
              echo "标签 \`${RELEASE_TAG}\` 等于 \`Support/Info.plist\` 的 \`${conf}\`，"
              echo "自检产物会叫 \`Vistile_${RELEASE_TAG}_macos_arm64.dmg\`，和线上 Release 里那个同名但不同字节。"
              echo "要自检就改用测试标签（例如 \`v9.9.9-dryrun\`）；要重发这一版本，请确认线上那个 Release 是你想覆盖的。"
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "==> 手动触发，跳过一致性检查（标签 ${RELEASE_TAG} 仅用于产物命名）"
          fi

      - name: 发布凭据是否齐备
        id: credentials
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${APPLE_DEVELOPER_ID_P12_BASE64:-}" ] || missing+=("APPLE_DEVELOPER_ID_P12_BASE64(+_PASSWORD)")
          if [ -z "${APPLE_API_KEY_BASE64:-}" ] && [ -z "${APPLE_ID:-}" ]; then
            missing+=("APPLE_API_KEY_BASE64(+APPLE_API_KEY_ID/APPLE_API_ISSUER) 或 APPLE_ID(+APPLE_TEAM_ID/APPLE_APP_SPECIFIC_PASSWORD)")
          fi
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
            echo "签名与公证凭据齐备，构建任务会运行。"
          else
            echo "ready=false" >>"$GITHUB_OUTPUT"
            {
              echo '### 缺少的 secrets'
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
              echo
              echo '构建任务仍会跑一次未签名自检（证明 runner 能编过这个项目），发布任务会跳过——没有公证票据的安装包没有发布意义。'
              echo '在 <https://github.com/'"${GITHUB_REPOSITORY}"'/settings/secrets/actions> 填好后重新推标签。'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "缺凭据，构建只做未签名自检，不会发布：${missing[*]}"
          fi

  probe-credentials:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probeCredentials }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: 导入 Developer ID 证书并试签
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: bash .github/scripts/import_signing_identity.sh

      - name: 验证公证凭据
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          # history 证明的是这把凭据能读，submit 才是能提交公证；后者要等第一次真公证才算证明。
          if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
            # 先落文件再 chmod：mktemp -d 给的是目录，直接 chmod 目录里的文件名会在它存在之前跑。
            key_dir="$(mktemp -d)"; chmod 700 "$key_dir"
            key="$key_dir/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D >"$key"
            chmod 600 "$key"
            xcrun notarytool history --key "$key" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --output-format json | jq '.history | length'
            rm -rf "$key_dir"
            echo "==> 公证可用：App Store Connect API key"
          elif [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            xcrun notarytool history --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --output-format json | jq '.history | length'
            echo "==> 公证可用：Apple ID + app-specific password"
          else
            echo "两条公证路线都没有凭据：需要 APPLE_API_KEY_BASE64(+ID/ISSUER) 或 APPLE_APP_SPECIFIC_PASSWORD" >&2
            exit 1
          fi

      - name: 清理临时钥匙串
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -e "${SIGNING_KEYCHAIN}" ]; then
            security delete-keychain "${SIGNING_KEYCHAIN}"
          fi

  build-macos:
    needs: verify
    # 缺 secrets 也照样构建：SKIP_SIGNING 只出未签名镜像，用来暴露「干净 runner 编不过」这类
    # 本机永远撞不到的缺口（首次上云最常见的就是它）。产物没签名没票据，release 任务不会发布它。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: 选最新 Xcode
        # 同 verify：本步就要 export，只写 GITHUB_ENV 时这一步打印的是镜像默认版本，
        # 真正构建用的却是下一步才生效的那个——日志和事实对不上。
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          export DEVELOPER_DIR="$newest/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >>"$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: 导入 Developer ID 证书
        if: ${{ needs.verify.outputs.signing_ready == 'true' }}
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: bash .github/scripts/import_signing_identity.sh

      - name: 构建、签名、公证、装订、复核
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SKIP_SIGNING: ${{ needs.verify.outputs.signing_ready == 'true' && '0' || '1' }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash .github/scripts/build_sign_notarize.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release/*.dmg

      - name: 清理临时钥匙串
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -e "${SIGNING_KEYCHAIN}" ]; then
            security delete-keychain "${SIGNING_KEYCHAIN}"
          fi

  release:
    needs: [verify, build-macos]
    # 未签名自检产物一律不发：只有凭据齐、真走过公证装订的那条路线才有发布资格。
    if: ${{ needs.verify.outputs.signing_ready == 'true' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts

      - name: 汇总产物与说明
        run: |
          set -euo pipefail
          # 先展平：download-artifact 是否按 artifact 名建子目录，取决于它拿到的路径与文件数，
          # 这里不赌这个行为（Sevqo 就是这么踩平过这一层的）。
          mkdir -p release
          find artifacts -type f -name '*.dmg' -exec cp {} release/ \;
          # 说明文字只有 RELEASE_NOTES.md 一个来源；CI 不自带模板，否则两条路线的话术会分叉。
          [ -s RELEASE_NOTES.md ] || { echo "缺少 RELEASE_NOTES.md，Release 正文没东西可写" >&2; exit 1; }
          ls -lh release/
          dmg="Vistile_${RELEASE_TAG}_macos_arm64.dmg"
          [ -s "release/${dmg}" ] || { echo "缺少 ${dmg}" >&2; exit 1; }
          {
            cat RELEASE_NOTES.md
            echo
            echo '## 下载'
            echo
            echo "| 平台 | 文件 |"
            echo '|------|------|'
            echo "| Apple Silicon | \`${dmg}\` |"
            echo
            echo 'Intel 未提供安装包，也未做真机验证。'
          } >release-body.md

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Vistile ${{ env.RELEASE_TAG }}
          body_path: release-body.md
          files: release/*.dmg
          fail_on_unmatched_files: true
          draft: false
          # P0 未验收之前，这条不该自己冒充正式版。
          prerelease: true
          make_latest: false
