name: Vistile
options:
  bundleIdPrefix: com.misswell
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: "Manual"
    DEVELOPMENT_TEAM: "U8U443D7ZL"
    COMBINE_HIDPI_IMAGES: "YES"

packages:
  VistileCore:
    path: Packages/VistileCore

targets:
  Vistile:
    type: application
    platform: macOS
    sources:
      - App
      - Permissions
      - Discovery
      - Capture
      - Rendering
      - Presentation
      - Recovery
      - Settings
      - Diagnostics
      - Resources
    dependencies:
      - package: VistileCore
    settings:
      base:
        PRODUCT_NAME: "Vistile"
        PRODUCT_BUNDLE_IDENTIFIER: com.misswell.Vistile
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Vistile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  UITestHarness:
    type: application
    platform: macOS
    sources:
      - UITestHarness
    settings:
      base:
        PRODUCT_NAME: "UITestHarness"
        PRODUCT_BUNDLE_IDENTIFIER: com.misswell.Vistile.UITestHarness
        INFOPLIST_FILE: Support/UITestHarness-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/UITestHarness.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  # 宿主测试（方案 §15.1 第二层）：跑在真实 AppKit/Metal 环境里，验证控制器转接、
  # CAMetalLayer 设备绑定、CMSampleBuffer 附件解析与协调器的异步交错。
  # 由 Vistile.app 承载，但 AppMain 检测到测试承载时不注册快捷键、不建窗口、不启动协调器。
  VistileHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/HostTests
    dependencies:
      - target: Vistile
    settings:
      base:
        PRODUCT_NAME: "VistileHostTests"
        PRODUCT_BUNDLE_IDENTIFIER: com.misswell.Vistile.HostTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vistile.app/Contents/MacOS/Vistile"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"

schemes:
  Vistile:
    build:
      targets:
        Vistile: all
        UITestHarness: all
    run:
      config: Debug

  VistileHostTests:
    build:
      targets:
        Vistile: all
        VistileHostTests: all
    test:
      config: Debug
      environmentVariables:
        VISTILE_TEST_HOST: "1"
      targets:
        - VistileHostTests

  P0Probe:
    build:
      targets:
        Vistile: all
    run:
      config: Debug
      environmentVariables:
        VISTILE_P0_MODE: "1"
